name: verify

# The gate for main. Typecheck, unit tests and a real build, because a change
# can pass vitest and still fail `tsc` or the atlas prebuild check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Runs qa/atlascheck.mjs as a prebuild, then tsc and vite build. This is
      # the step that catches a missing atlas frame with no primitive fallback.
      - name: Build
        run: npm run build
